# Fly.io config for Artisan Market. See DEPLOY.md for first-time setup.
app = "artisan-market"        # must be globally unique; change if taken
primary_region = "fra"        # Frankfurt; put the database in the same region

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs in a temporary machine with the new image before traffic switches.
  release_command = "node_modules/.bin/prisma migrate deploy"
  strategy = "immediate"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  PLATFORM_COMMISSION_BPS = "1000"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep the machine running: it owns the WebSocket rooms and the jobs that
  # start/close auctions on time. Stopped machines would close auctions late.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"     # WebSockets are long-lived connections
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
